# Builds a signed bundle and uploads it to the Play internal testing track.
#
# Inert until these repository secrets exist:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS,
#   PLAY_SERVICE_ACCOUNT_JSON
# See play/RELEASE.md.
name: Play internal release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set — see play/RELEASE.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > paraphase-release.jks
          cat > keystore.properties <<PROPS
          storeFile=paraphase-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build bundle
        run: ./gradlew bundleRelease

      - name: Upload to internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.paraphase.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Clean up secrets from the runner
        if: always()
        run: rm -f paraphase-release.jks keystore.properties
