<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1280" height="640" preserveAspectRatio="xMidYMid slice"
     role="img" aria-label="Paraphrase — rewrite any text, right where you typed it">
  <title>Paraphrase social preview</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A1740"/><stop offset="0.55" stop-color="#2C2064"/>
      <stop offset="1" stop-color="#3B1D6E"/>
    </linearGradient>
    <radialGradient id="glow1" cx="840" cy="90" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9333EA" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9333EA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="120" cy="440" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="70" y1="190" x2="200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#glow1)"/>
  <rect width="1024" height="500" fill="url(#glow2)"/>

  <rect x="64" y="184" width="132" height="132" rx="32" fill="url(#tile)"/>
  <g transform="translate(64,184) scale(1.222) translate(54,54) scale(0.9) translate(-54,-54)"
     fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M29.6,45.1 A26,26 0 0 1 78.4,45.1"/>
    <path d="M81.8,35.8 L78.4,45.1 L70.8,38.7"/>
    <path d="M78.4,62.9 A26,26 0 0 1 29.6,62.9"/>
    <path d="M26.2,72.2 L29.6,62.9 L37.2,69.3"/>
    <path d="M40,48 L68,48"/>
    <path d="M40,60 L58,60" stroke-opacity="0.72"/>
  </g>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="240" y="196" fill="#FFFFFF" font-size="58" font-weight="700" letter-spacing="-1.6">Rewrite any text,</text>
    <text x="240" y="262" fill="#FFFFFF" font-size="58" font-weight="700" letter-spacing="-1.6">right where you typed it.</text>
    <text x="240" y="318" fill="#D7D2F5" font-size="26">Select text in any app, tap Paraphrase, and the words</text>
    <text x="240" y="352" fill="#D7D2F5" font-size="26">are replaced in place.</text>
    <g font-size="19" fill="#EDEAFB">
      <rect x="240" y="380" width="106" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <text x="266" y="406">Formal</text>
      <rect x="358" y="380" width="106" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <text x="382" y="406">Casual</text>
      <rect x="476" y="380" width="118" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <text x="500" y="406">Concise</text>
      <rect x="606" y="380" width="152" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <text x="630" y="406">Fix grammar</text>
    </g>
  </g>
</svg>
