<!doctype html><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:1024px;height:500px;overflow:hidden}
  body{
    background:
      radial-gradient(620px 420px at 82% 18%, rgba(147,51,234,.55), transparent 70%),
      radial-gradient(520px 380px at 12% 88%, rgba(56,189,248,.35), transparent 70%),
      linear-gradient(120deg,#1a1740 0%,#2c2064 55%,#3b1d6e 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#fff;display:flex;align-items:center;gap:44px;padding:0 64px;box-sizing:border-box;
  }
  .mark{width:132px;height:132px;border-radius:32px;flex:0 0 auto;
    background:linear-gradient(135deg,#6366F1,#9333EA);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 18px 50px rgba(76,29,149,.55)}
  h1{font-size:62px;line-height:1.03;margin:0;letter-spacing:-1.6px;font-weight:700}
  p{margin:14px 0 0;font-size:26px;line-height:1.35;color:#d7d2f5;max-width:640px}
  .strip{margin-top:22px;display:flex;gap:10px}
  .chip{font-size:19px;padding:8px 16px;border-radius:999px;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)}
</style>
<div class="mark">
  <svg width="88" height="88" viewBox="0 0 108 108" fill="none" stroke="#fff"
       stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M29.6,45.1 A26,26 0 0 1 78.4,45.1"/>
    <path d="M81.8,35.8 L78.4,45.1 L70.8,38.7"/>
    <path d="M78.4,62.9 A26,26 0 0 1 29.6,62.9"/>
    <path d="M26.2,72.2 L29.6,62.9 L37.2,69.3"/>
    <path d="M40,48 L68,48"/>
    <path d="M40,60 L58,60" stroke-opacity="0.72"/>
  </svg>
</div>
<div>
  <h1>Rewrite any text,<br>right where you typed it.</h1>
  <p>Select text in any app, tap Paraphrase, and the words are replaced in place.</p>
  <div class="strip"><span class="chip">Formal</span><span class="chip">Casual</span><span class="chip">Concise</span><span class="chip">Fix grammar</span></div>
</div>
